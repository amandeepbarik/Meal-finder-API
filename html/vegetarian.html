<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Finder | Find Your Next Recipe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="vegetarian">
    <nav class="navbar" data-bs-theme="dark">
        <div class="container-fluid" id="navbarContainer">
            <a class="navbar-brand" href="home.html">
                <i class="fa-solid fa-house"></i>
                <span>MEAL FINDER</span>
            </a>

            <button class="navbar-toggler" id="navbarToggler" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
                    aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="offcanvas offcanvas-end meal-offcanvas" id="offcanvasNavbar"
                 tabindex="-1" aria-label="Meal categories">
                <div class="offcanvas-header">
                    <button class="meal-close" type="button" data-bs-dismiss="offcanvas" aria-label="Close">
                        <i class="fa-regular fa-circle-xmark"></i>
                    </button>
                </div>

                <div class="offcanvas-body">
                    <ul class="category-list" id="navCategoryList" aria-label="Meal categories"></ul>
                </div>
            </div>
        </div>
    </nav>
    <header class="banner">
        <form class="search-container" id="searchForm" role="search">
            <input class="search-input" type="text" name="q" autocomplete="off"
                   placeholder="Search recipes here..." aria-label="Search recipes">

            <button class="search-btn" type="submit" aria-label="Submit search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </form>

        <h2>What are your favorite cuisines?</h2>
        <p>PERSONALIZE YOUR EXPERIENCE</p>
    </header>

    <main>
        <section class="description-card" id="categoryDescription" hidden>
            <h3 class="description-title" id="descriptionTitle"></h3>
            <p class="description-text" id="descriptionText"></p>
        </section>

        <section class="categories-section results-section" aria-labelledby="resultsTitle">
            <div class="results-heading">
                <div>
                    <h3 class="categories-title" id="resultsTitle">MEALS</h3>
                    <div class="title-underline"></div>
                </div>
                <a class="back-link" href="home.html">All categories</a>
            </div>

            <p class="page-status" id="resultsStatus" role="status" aria-live="polite">
                Loading recipes...
            </p>
            <div class="meal-grid" id="recipeGrid"></div>
            <template id="recipeCardTemplate">
                <div class="meal-column">
                    <a class="recipe-card" href="#">
                        <img src="" alt="" loading="lazy">
                        <div class="card-content">
                            <p class="recipe-origin"></p>
                            <h4 class="recipe-title"></h4>
                        </div>
                    </a>
                </div>
            </template>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <script src="../js/app.js"></script>
</body>
</html>
